name: MiniRedis Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-server:
    name: Build C++ Core Engine & Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - name: Configure CMake
        run: cmake -B server/build -S server -DCMAKE_BUILD_TYPE=Release

      - name: Compile Core Engine & Binary
        run: cmake --build server/build --target miniredis-server -j$(nproc)

  sanitizers:
    name: Sanitizer Verifications (ASan, UBSan, TSan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential clang

      - name: Build Under AddressSanitizer & UBSan
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -B server/build_asan -S server -DENABLE_ASAN=ON
          cmake --build server/build_asan --target miniredis-server -j$(nproc)

      - name: Build Under ThreadSanitizer
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -B server/build_tsan -S server -DENABLE_TSAN=ON
          cmake --build server/build_tsan --target miniredis-server -j$(nproc)

  bridge-and-dashboard:
    name: Node.js Bridge & React Dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test Node.js Bridge
        run: |
          cd bridge
          npm ci
          npm test

      - name: Test & Build React Dashboard
        run: |
          cd dashboard
          npm ci
          npm test
          npm run build
